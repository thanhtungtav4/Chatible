version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatible_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatible_user
      POSTGRES_PASSWORD: chatible_secret_password
      POSTGRES_DB: chatible_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatible_user -d chatible_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatible_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: chatible_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  media-worker:
    image: node:20-alpine
    container_name: chatible_media_worker
    profiles: ["app"]
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "apk add --no-cache ffmpeg && npm --workspace=backend run start:media-worker"
    mem_limit: 768m
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://chatible_user:chatible_secret_password@postgres:5432/chatible_db
      REDIS_URL: redis://redis:6379
      MEDIA_WORKER_CONCURRENCY: "1"
      MEDIA_WORKER_THREADS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ffmpeg -version >/dev/null 2>&1 && node -e \"const Redis=require('ioredis');const r=new Redis(process.env.REDIS_URL);r.zrangebyscore('health:media:workers',Date.now()-15000,'+inf').then(x=>{r.disconnect();process.exit(x.length>0?0:1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3

  backend-api:
    image: node:20-alpine
    container_name: chatible_backend_api
    profiles: ["app"]
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: npm --workspace=backend run start
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      EMBEDDED_MEDIA_WORKER: "false"
      DATABASE_URL: postgresql://chatible_user:chatible_secret_password@postgres:5432/chatible_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data:
